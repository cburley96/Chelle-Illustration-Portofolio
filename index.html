<!DOCTYPE html>

<body class="page-fade">

    <header class="main-header header-fade">
        <div class="header-content">
            <div class="branding">
                <img src="images/signature/chelle_signature-transparent-cropped.png" alt="Chelle Palassis signature" class="site-signature">

            </div>
            <nav>
                <a href="index.html">Work</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

    </header>

    <main class="gallery-container page-fade">

</main>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Expanded View">
        </div>
        <button class="next" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <script src="js/script.js"></script>
